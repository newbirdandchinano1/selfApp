name: iOS-Build-Final

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  CI: true
  EXPO_NO_GIT_STATUS: 1
  COCOAPODS_DISABLE_STATS: true

jobs:
  build:
    # 保留原来的成功环境
    # 当前你的 macos-latest 实际使用 Xcode 26.6
    runs-on: macos-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 1. Checkout
        uses: actions/checkout@v7

      # ============================================================
      # 2. Setup Node
      # ============================================================
      - name: 2. Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 3. Detect / Verify Build Environment
      # ============================================================
      #
      # 把 Xcode 版本写入仓库工作区，
      # 后面的 cache key 会把 Xcode 版本计算进去。
      #
      # 这样以后 GitHub 把 macos-latest 的 Xcode 从 26.6
      # 升级到其他版本时，不会错误复用旧 DerivedData。
      #
      - name: 3. Verify Environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Node"
          echo "========================================"
          node -v

          echo "========================================"
          echo "npm"
          echo "========================================"
          npm -v

          echo "========================================"
          echo "CocoaPods"
          echo "========================================"
          pod --version

          echo "========================================"
          echo "Ruby"
          echo "========================================"
          ruby --version

          echo "========================================"
          echo "Xcode"
          echo "========================================"
          xcodebuild -version

          echo "========================================"
          echo "macOS"
          echo "========================================"
          sw_vers

          echo "========================================"
          echo "Architecture"
          echo "========================================"
          uname -m

          echo "========================================"
          echo "Save Xcode version for cache key"
          echo "========================================"

          xcodebuild -version > .xcode-version-ci

          cat .xcode-version-ci

      # ============================================================
      # 4. Cache CocoaPods
      # ============================================================
      - name: 4. Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('.xcode-version-ci', 'package-lock.json', 'app.json', 'app.config.js', 'app.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      # ============================================================
      # 5. (removed) 不再缓存全局 DerivedData
      # ============================================================
      # 构建改用仓库内 deriveddata/（见 step 9），避免 find 误捡旧 .app。

      # ============================================================
      # 6. Install JavaScript Dependencies
      # ============================================================
      #
      # npm ci：
      # - 严格使用 package-lock.json
      # - 更适合 CI
      # - 配合 setup-node 的 npm cache
      #
      - name: 6. Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      # ============================================================
      # 6b. Strip widgets for unsigned / 企业签 IPA
      # ============================================================
      #
      # 未签名 IPA 经企业签/超级签重签时，PlugIns/*.appex 与
      # App Group 经常签坏 → 真机一点图标系统直接杀进程（闪退）。
      # 默认去掉 expo-widgets；若已有完整签名链路可设
      # CI_KEEP_WIDGETS=1（仓库 Variables / Secrets 均可）。
      #
      - name: 6b. Prepare unsigned iOS (strip widgets)
        run: node scripts/ci-prepare-unsigned-ios.mjs

      # ============================================================
      # 7. Expo Prebuild
      # ============================================================
      #
      # --clean：
      # 每次从干净状态重新生成 ios/
      #
      # --no-install：
      # npm ci 已经完成依赖安装，
      # 不让 Expo 再重复执行 npm install。
      #
      - name: 7. Expo Prebuild
        run: |
          npx expo prebuild \
            --platform ios \
            --clean \
            --no-install

      # ============================================================
      # 8. Install CocoaPods Dependencies
      # ============================================================
      - name: 8. Install Pods
        working-directory: ios
        shell: bash
        run: |
          set -e

          echo "Installing CocoaPods dependencies..."

          pod install

      # ============================================================
      # 9. Build Xcode Project
      # ============================================================
      #
      # 固定 -derivedDataPath，避免从全局 DerivedData 缓存里
      # find | head -n1 误捡旧/错的 .app。
      #
      - name: 9. Build Xcode Project
        working-directory: ios
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Find Xcode Workspace"
          echo "========================================"

          WORKSPACE=$(find . \
            -maxdepth 1 \
            -name "*.xcworkspace" \
            -print \
            -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: .xcworkspace not found"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          echo "========================================"
          echo "Find Xcode Project"
          echo "========================================"

          XCODEPROJ=$(find . \
            -maxdepth 1 \
            -name "*.xcodeproj" \
            -print \
            -quit)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: .xcodeproj not found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          DERIVED_DATA="${GITHUB_WORKSPACE}/deriveddata"

          echo "Project: $XCODEPROJ"
          echo "Scheme: $SCHEME"
          echo "DerivedData: $DERIVED_DATA"

          rm -rf "$DERIVED_DATA"
          mkdir -p "$DERIVED_DATA"

          echo "========================================"
          echo "Xcode Build Start"
          echo "========================================"

          START_TIME=$(date +%s)

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            build

          END_TIME=$(date +%s)

          BUILD_TIME=$((END_TIME - START_TIME))

          echo "========================================"
          echo "Xcode Build Finished"
          echo "========================================"
          echo "Build time: ${BUILD_TIME} seconds"
          echo "Build time: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"

      # ============================================================
      # 10. Locate APP + verify JS bundle
      # ============================================================
      - name: 10. Locate APP
        id: locate_app
        shell: bash
        run: |
          set -e

          DERIVED_DATA="${GITHUB_WORKSPACE}/deriveddata"
          PRODUCTS="${DERIVED_DATA}/Build/Products/Release-iphoneos"

          echo "Searching under: $PRODUCTS"
          ls -la "$PRODUCTS" || true

          APP_PATH=$(find "$PRODUCTS" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            ! -name "*.appex" \
            -print \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Release .app not found under $PRODUCTS"
            exit 1
          fi

          echo "Found APP: $APP_PATH"

          echo "========================================"
          echo "Verify embedded JS bundle (Release 闪退常见缺包)"
          echo "========================================"

          BUNDLE=""
          for candidate in \
            "$APP_PATH/main.jsbundle" \
            "$APP_PATH/main.jsbundle.hbc" \
            "$APP_PATH/hermes.bundle" \
            ; do
            if [ -f "$candidate" ]; then
              BUNDLE="$candidate"
              break
            fi
          done

          # Expo / RN 有时把 bundle 放在更深层或带 hash 名
          if [ -z "$BUNDLE" ]; then
            BUNDLE=$(find "$APP_PATH" -maxdepth 2 \( -name "*.jsbundle" -o -name "*.hbc" \) -type f | head -n 1 || true)
          fi

          if [ -z "$BUNDLE" ]; then
            echo "ERROR: no JS bundle inside .app — Release 真机必闪退"
            echo "APP contents (top):"
            ls -la "$APP_PATH" | head -n 80
            exit 1
          fi

          echo "JS bundle OK: $BUNDLE ($(wc -c < "$BUNDLE") bytes)"

          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "PlugIns present (企业签风险):"
            find "$APP_PATH/PlugIns" -maxdepth 2 -print
            echo "WARN: unsigned IPA with appex often 闪退 after 重签; prefer strip widgets (default)."
          else
            echo "No PlugIns/ — good for 企业签 unsigned IPA"
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Create IPA
      # ============================================================
      - name: 11. Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          APP_PATH="${{ steps.locate_app.outputs.app_path }}"

          echo "Copy APP:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" Payload/

          # 兜底：即使误带了 appex，打包前再剥掉，避免重签后系统杀进程
          for app in Payload/*.app; do
            if [ -d "$app/PlugIns" ]; then
              echo "Stripping PlugIns from $app ..."
              rm -rf "$app/PlugIns"
            fi
          done

          echo "Creating IPA..."

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            MyApp.ipa

          echo "========================================"
          echo "IPA Created"
          echo "========================================"

          ls -lh MyApp.ipa

      # ============================================================
      # 12. Upload IPA
      # ============================================================
      - name: 12. Upload
        uses: actions/upload-artifact@v7
        with:
          name: MyUnsignedIPA
          path: MyApp.ipa
          retention-days: 7
