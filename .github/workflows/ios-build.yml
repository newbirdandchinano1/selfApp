name: iOS-Build-Final

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  CI: true
  EXPO_NO_GIT_STATUS: 1
  COCOAPODS_DISABLE_STATS: true

jobs:
  build:
    runs-on: macos-15

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 1. Checkout
        uses: actions/checkout@v7

      # ============================================================
      # 2. Setup Node
      # ============================================================
      - name: 2. Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 3. Verify Environment
      # ============================================================
      - name: 3. Verify Environment
        run: |
          echo "===== Node ====="
          node -v

          echo "===== npm ====="
          npm -v

          echo "===== CocoaPods ====="
          pod --version

          echo "===== Ruby ====="
          ruby --version

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== macOS ====="
          sw_vers

          echo "===== Architecture ====="
          uname -m

      # ============================================================
      # 4. Cache CocoaPods
      # ============================================================
      - name: 4. Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('package-lock.json', 'app.json', 'app.config.js', 'app.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      # ============================================================
      # 5. Cache Xcode DerivedData
      # ============================================================
      - name: 5. Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode16.4-${{ hashFiles('package-lock.json', 'app.json', 'app.config.js', 'app.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-xcode16.4-

      # ============================================================
      # 6. Install Dependencies
      # ============================================================
      - name: 6. Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      # ============================================================
      # 7. Expo Prebuild
      # ============================================================
      - name: 7. Expo Prebuild
        run: |
          npx expo prebuild \
            --platform ios \
            --clean \
            --no-install

      # ============================================================
      # 8. Install Pods
      # ============================================================
      - name: 8. Install Pods
        working-directory: ios
        run: |
          echo "Installing CocoaPods dependencies..."
          pod install --verbose

      # ============================================================
      # 9. Build Xcode Project
      # ============================================================
      - name: 9. Build Xcode Project
        working-directory: ios
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Finding Xcode workspace..."
          echo "========================================"

          WORKSPACE=$(find . \
            -maxdepth 1 \
            -name "*.xcworkspace" \
            -print \
            -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: .xcworkspace not found"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          echo "========================================"
          echo "Finding Xcode project..."
          echo "========================================"

          XCODEPROJ=$(find . \
            -maxdepth 1 \
            -name "*.xcodeproj" \
            -print \
            -quit)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: .xcodeproj not found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          echo "Project: $XCODEPROJ"
          echo "Scheme: $SCHEME"

          echo "========================================"
          echo "Build start"
          echo "========================================"

          START_TIME=$(date +%s)

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            -showBuildTimingSummary \
            -parallelizeTargets \
            build

          END_TIME=$(date +%s)

          echo "========================================"
          echo "Build finished"
          echo "========================================"

          echo "Xcode build time: $((END_TIME - START_TIME)) seconds"

      # ============================================================
      # 10. Locate APP
      # ============================================================
      - name: 10. Locate APP
        id: locate_app
        shell: bash
        run: |
          set -e

          APP_PATH=$(find \
            ~/Library/Developer/Xcode/DerivedData \
            -type d \
            -name "*.app" \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Release .app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Create IPA
      # ============================================================
      - name: 11. Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          APP_PATH="${{ steps.locate_app.outputs.app_path }}"

          echo "Copying:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" Payload/

          echo "Creating IPA..."

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            MyApp.ipa

          echo "IPA created:"
          ls -lh MyApp.ipa

      # ============================================================
      # 12. Upload Artifact
      # ============================================================
      - name: 12. Upload
        uses: actions/upload-artifact@v7
        with:
          name: MyUnsignedIPA
          path: MyApp.ipa
          retention-days: 7
